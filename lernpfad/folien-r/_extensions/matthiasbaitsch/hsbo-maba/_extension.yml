title: hsbo-maba
author: Matthias Baitsch
version: 0.2.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    revealjs:
      lang: de
      overview: true
      slide-number: c/t
      transition: fade
      transition-speed: slow
      code-line-numbers: false
      html-math-method:
        method: mathjax
        url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
      theme:
        - slides.scss
        - titlepage.scss
    html:
      lang: de
      theme:
        - html.scss
