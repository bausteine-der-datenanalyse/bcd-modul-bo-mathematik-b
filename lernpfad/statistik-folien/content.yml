# Output goes here, this folder is cleared on each run
# Absolute path or relative to the folder containing this file
target-folder: "c"

# Folder where things go for deployment, relative to project folder
deploy-folder: __output/lernpfad/statistik-folien/c

# Global variable definitions
definitions:
- bcd-bausteine-statistik: ${project-folder}/bausteine/bcd-bausteine-statistik

# Jobs
jobs:
# Die Folien suchen _bcd-setup.R im nächsten Ordner darüber, der die Datei enthält
- copy:
  from: ${bcd-bausteine-statistik}/_bcd-setup.R
  to: ${target-folder}/_bcd-setup.R
  overwrite: true
# Hilfsfunktionen aus dem Skript lesen Daten relativ zum Ordner der Folien
- symlink:
  target: ../skript/01-daten
  link: ${target-folder}/folien/01-daten

# Jobs running on all parts
jobs-on-parts:

# Die Folien verwenden Bilder und Daten aus ../skript, daher gleiche Struktur in c/
- copy:
  from: ${part-folder}/folien.qmd
  to: ${target-folder}/folien/${idx}-${name}.qmd
- copy:
  from: ${part-folder}/../skript/00-bilder
  to: ${target-folder}/skript/00-bilder
  optional: yes
  exclude-patterns: [".afdesign$", ".af$", "~lock~$"]
- copy:
  from: ${part-folder}/../skript/01-daten
  to: ${target-folder}/skript/01-daten
  optional: yes

# Pattern to extract name from part folder
part-name-pattern: "m\\-(.*)/"

# Parts, folders relative to project root
parts:
- folder: bausteine/bcd-bausteine-statistik/m-statistische-daten/folien
- folder: bausteine/bcd-bausteine-statistik/m-einzelne-merkmale/folien
